{% extends 'main/base.html' %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 30px auto; padding: 25px; border: 1px solid #ccc; border-radius: 8px; background: #f9f9f9;">
    <h2>{{ title }}</h2>
    <hr style="margin-bottom: 20px;">
    
    <!-- Важливо: enctype потрібен для правильного завантаження картинок (аватарів) -->
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        
        <h3 style="color: #4e73df; margin-bottom: 10px;">Основні дані</h3>
        {{ user_form.as_p }}
        
        <hr style="margin: 20px 0;">
        
        <h3 style="color: #4e73df; margin-bottom: 10px;">Додаткова інформація</h3>
        {{ profile_form.as_p }}
        
        <div style="margin-top: 25px; display: flex; gap: 15px;">
            <button type="submit" style="background: #28a745; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold;">Зберегти зміни</button>
            <a href="{% url 'accounts:profile' %}" style="display: inline-block; background: #6c757d; color: white; padding: 10px 20px; text-decoration: none; border-radius: 4px; font-weight: bold;">Скасувати</a>
        </div>
    </form>
</div>
{% endblock %}
